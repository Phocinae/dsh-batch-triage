name: release

# OIDC trusted publishing. Before this workflow existed, the only way to publish
# this package was a long-lived npm token — which is why the token could not be
# retired. `npm publish` with `id-token: write` and npm >= 11.5.1 exchanges the
# GitHub OIDC token for a short-lived publish credential; no secret is stored
# here.
#
# One manual step remains (web UI, no API): on npmjs.com, package
# dsh-batch-triage → Settings → Trusted Publisher, add
#   Publisher: GitHub Actions
#   Organization/user: Phocinae
#   Repository: dsh-batch-triage
#   Workflow filename: release.yml
#   Environment: npm
# Until that exists the publish job fails at the upload step, which is the
# correct failure: it cannot fall back to a token that is not here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test suite
        run: npm test
      - name: Packed-artefact self-check
        run: npm run verify:artifacts

  publish:
    name: publish to npm (OIDC trusted publishing)
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/dsh-batch-triage
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.x; the explicit floor check below fails loudly
          # if a future runner image ever drops below the OIDC minimum.
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: The tag must match package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "tag v$tag matches package.json"

      - name: npm must support trusted publishing (>= 11.5.1)
        run: |
          node -e '
            const { execSync } = require("child_process");
            const v = execSync("npm --version").toString().trim().split(".").map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && v[1] >= 5);
            if (!ok) {
              console.error(`npm ${v.join(".")} < 11.5.1: trusted publishing is unavailable`);
              process.exit(1);
            }
            console.log(`npm ${v.join(".")} supports trusted publishing`);
          '

      # prepack runs `npm test` again; that is deliberate. The tarball that gets
      # uploaded is the one whose tests ran immediately before packing.
      #
      # A version already on the registry is a successful no-op, not a red run:
      # this lets a tag be pushed after a manual publish and makes a re-run
      # idempotent. `npm view` needs no auth.
      - name: Is this version already on npm?
        id: published
        run: |
          pkg=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$pkg@$ver is already published; skipping the upload"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public
